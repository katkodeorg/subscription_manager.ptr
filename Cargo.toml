[package]
name        = "subscription-manager"
version = "1.0.0"
edition     = "2024"
description = "Pointiv community extension: track subscription renewals, spend, and free trials"

[dependencies]
extism-pdk = "1.4.1"
pointiv-extension-sdk = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lib]
name       = "extension"
crate-type = ["cdylib"]

[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
strip         = "symbols"
panic         = "abort"
